[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dracoconv"
version = "0.1.0"
description = "Convertisseur Draco (.drc) pour modèles 3D : STL, OBJ, PLY, 3MF, ZIP — dans les deux sens, par lots"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "networkx",
    "lxml",
    "DracoPy>=2.0",
    "PySide6>=6.8",
    "send2trash",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "cmake"]

[project.scripts]
dracoconv = "dracoconv.cli:main"

[project.gui-scripts]
dracoconv-gui = "dracoconv.gui.app:main"

[tool.setuptools.packages.find]
include = ["dracoconv*"]

[tool.setuptools.package-data]
dracoconv = ["locales/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
